<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d1117" />
  <title>Deck or No Deck</title>
  <!--
    BUGFIX (monetización): sin este script, `window.CrazyGames` nunca
    existe — CrazyGamesService.isAvailable() siempre da `false` en
    producción, y las 3 solicitudes de Rewarded Ad (Revivir, Duplicar,
    Triplicar) fallan en silencio con { success: false, reason: 'sdk_unavailable' }
    ANTES de siquiera intentar mostrar el anuncio (ver el guard temprano
    en MultiplyRewardUseCase.execute() / ReviveWithAdUseCase.execute()).
    Va síncrono en <head>, ANTES del bundle del juego: así
    `window.CrazyGames.SDK` ya existe cuando cualquier código nuestro
    corre, sin importar en qué momento se llegue a usarlo.
  -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <script type="module" src="./src/main.ts"></script>
  <style>
    /* BUGFIX (ads en pantalla completa, ver comentario en main.ts junto a
       `fullscreenTarget`): `<html>` es ahora el elemento que entra en
       fullscreen, así que necesita tamaño explícito — algunos navegadores
       no lo estiran solos al 100% del viewport si el elemento fullscreen
       no lo tenía ya seteado. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d1117; overflow: hidden; }
    /* Móvil: sin zoom por doble toque/pellizco, sin "tirar para refrescar", sin
       selección de texto ni menú de pulsación larga sobre el juego. */
    html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
                 -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* `fixed` + `dvh`: en teléfonos `100vh` incluye la barra de direcciones y
       recortaba el canvas por abajo; `dvh` sigue la altura visible real. */
    #game-container { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
                      width: 100%; height: 100vh; height: 100dvh; }
    #rotate-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: #0d1117; color: #ffd76a;
                      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
                      padding: 24px; text-align: center; font-family: Georgia, "Times New Roman", serif; }
    #rotate-title { font-size: 26px; font-weight: bold; }
    #rotate-hint { font-size: 17px; color: #cbd5e1; font-family: Arial, sans-serif; }
    .rotate-icon { font-size: 64px; animation: rotate-hint 2.4s ease-in-out infinite; }
    @keyframes rotate-hint { 0%, 15% { transform: rotate(0deg); } 50%, 65% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate-overlay { display: flex; } }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <!-- Aviso para girar el teléfono: el juego es horizontal (1280x720). Solo se
       muestra en pantallas táctiles en vertical; el texto lo pone main.ts con
       el idioma activo (ROTATE_DEVICE_TITLE / ROTATE_DEVICE_HINT). -->
  <div id="rotate-overlay" role="alert">
    <div class="rotate-icon" aria-hidden="true">&#128241;</div>
    <div id="rotate-title"></div>
    <div id="rotate-hint"></div>
  </div>
</body>
</html>
