<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck or No Deck</title>
  <!--
    BUGFIX (monetización): sin este script, `window.CrazyGames` nunca
    existe — CrazyGamesService.isAvailable() siempre da `false` en
    producción, y las 3 solicitudes de Rewarded Ad (Revivir, Duplicar,
    Triplicar) fallan en silencio con { success: false, reason: 'sdk_unavailable' }
    ANTES de siquiera intentar mostrar el anuncio (ver el guard temprano
    en MultiplyRewardUseCase.execute() / ReviveWithAdUseCase.execute()).
    Va síncrono en <head>, ANTES del bundle del juego: así
    `window.CrazyGames.SDK` ya existe cuando cualquier código nuestro
    corre, sin importar en qué momento se llegue a usarlo.
  -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <script type="module" src="./src/main.ts"></script>
  <style>
    /* BUGFIX (ads en pantalla completa, ver comentario en main.ts junto a
       `fullscreenTarget`): `<html>` es ahora el elemento que entra en
       fullscreen, así que necesita tamaño explícito — algunos navegadores
       no lo estiran solos al 100% del viewport si el elemento fullscreen
       no lo tenía ya seteado. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d1117; overflow: hidden; }
    #game-container { display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
